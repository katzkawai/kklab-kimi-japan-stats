name: Update data

on:
  schedule:
    # 毎月9日 02:37 UTC（11:37 JST）。WDI の更新頻度は年数回なので月1回で十分
    - cron: "37 2 9 * *"
  workflow_dispatch: # Actions タブから手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Fetch latest data and regenerate JSON
        run: uv run tools/update_data.py

      - name: Commit and push if data changed
        run: |
          if git diff --quiet data/indicators.json; then
            echo "データに変更なし。コミットをスキップします"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/indicators.json
            git commit -m "Update data ($(date +%F))"
            git push
          fi
